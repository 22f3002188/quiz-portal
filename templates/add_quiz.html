<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Create Quiz</h2>
        <form action="{{ url_for('add_quiz', chapter_id=chapter.id) }}" method="POST">
            <label>quiz name:</label>
            <input type="text" name="quiz_name" class="form-control" required>
            <label>Quiz Date:</label>
            <input type="date" name="date_of_quiz" class="form-control" required>
            <label>Time Duration (HH:MM):</label>
            <input type="time" name="time_duration" class="form-control" required>
            
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Create Quiz</button>
                <a href="{{ url_for('view_quizzes', chapter_id=chapter.id) }}" class="btn btn-primary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
