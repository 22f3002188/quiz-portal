<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script>
        function addQuestion() {
            let questionsContainer = document.getElementById("questions-container");
            let questionIndex = questionsContainer.children.length + 1;
            
            let questionDiv = document.createElement("div");
            questionDiv.classList.add("card", "p-3", "mb-3");
            questionDiv.innerHTML = `
                <h5>Question ${questionIndex}</h5>
                <label>Question Statement:</label>
                <input type="text" name="question_statement[]" class="form-control" required>
                <label>Option 1:</label>
                <input type="text" name="option1[]" class="form-control" required>
                <label>Option 2:</label>
                <input type="text" name="option2[]" class="form-control" required>
                <label>Option 3:</label>
                <input type="text" name="option3[]" class="form-control">
                <label>Option 4:</label>
                <input type="text" name="option4[]" class="form-control">
                <label>Correct Answer:</label>
                <select name="correct_answer[]" class="form-control" required>
                    <option value="option1">Option 1</option>
                    <option value="option2">Option 2</option>
                    <option value="option3">Option 3</option>
                    <option value="option4">Option 4</option>
                </select>
                <button type="button" class="btn btn-danger mt-2" onclick="removeQuestion(this)">Delete Question</button>
            `;
            questionsContainer.appendChild(questionDiv);
        }
        
        function removeQuestion(button) {
            button.parentElement.remove();
        }
    </script>
</head>
<body>
    <div class="container mt-5">
        <h2>Create Quiz</h2>
        <form action="{{ url_for('add_quiz', chapter_id=chapter.id) }}" method="POST">
            <label>Quiz Date:</label>
            <input type="datetime-local" name="date_of_quiz" class="form-control" required>
            
            <label>Time Duration (HH:MM:SS):</label>
            <input type="time" name="time_duration" class="form-control" required>
            
            <h3 class="mt-4">Questions</h3>
            <div id="questions-container"></div>
            
            <button type="button" class="btn btn-primary mt-3" onclick="addQuestion()">Add Question</button>
            <button type="submit" class="btn btn-success mt-3">Create Quiz</button>
        </form>
    </div>
</body>
</html>
