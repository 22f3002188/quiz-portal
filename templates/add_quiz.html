<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Form</title>
    <style>
        * {
            margin: 0px;
        }

        .my_container {
            border: 2px solid black;
        }

        .my_panel {
            width: 80%;
            margin: auto;
            height: auto;
            border: 1px dashed black;
            padding: 20px;
        }

        .input_form {
            border: 1px solid rgb(0, 255, 13);
            width: 600px;
            margin: auto;
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: justify;
        }

        .outer_box {
            border: 1px solid orange;
            margin: auto;
            padding: 10px;
            border-radius: 10px;
        }

        .centre {
            text-align: center;
            margin: auto;
            color: rgb(5, 5, 110);
        }

        .button_container {
            text-align: center;
            margin-top: 10px;
        }

        .button_container button {
            padding: 5px 15px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="my_panel">
        <div class="input_form">
            <h3 class='centre'>New Quiz</h3>
            <label>Chapter ID: <input type="text"></label><br>
            <label>Date: <input type="date"></label><br>
            <label>Duration: <input type="text"></label><br>
            <div class="button_container">
                <button style="background-color: lightblue;">Save</button>
                <button style="background-color: lightcoral;">Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
