<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h2 class="text-center">Quiz Details</h2>

        <div class="card mt-4 p-4">
            <div class="mb-3">
                <label class="form-label fw-bold">ID:</label>
                <input type="text" class="form-control" value="{{ quiz.id }}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Subject:</label>
                <input type="text" class="form-control" value="{{ quiz.subject }}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Chapter:</label>
                <input type="text" class="form-control" value="{{ quiz.chapter }}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Number of Questions:</label>
                <input type="text" class="form-control" value="{{ quiz.num_questions }}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Scheduled Date:</label>
                <input type="text" class="form-control" value="{{ quiz.date }}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Duration (hh:mm):</label>
                <input type="text" class="form-control" value="{{ quiz.duration }}" readonly>
            </div>
            <div class="text-center">
                <button class="btn btn-primary" onclick="window.history.back();">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
