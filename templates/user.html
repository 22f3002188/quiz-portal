<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../static/style/main.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <title>User Dashboard</title>
    </head>
    <body>
        <div class="my_container">
            <div class="centre"><h1>Welcome to User Dashboard</h1></div>
            <div class="my_panel">
                <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e3f2fd;">
                    <div class="collapse navbar-collapse" id="navbarText">
                      <ul class="navbar-nav mr-auto">
                        <li class="nav-item active">
                          <a class="nav-link" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                          <a class="nav-link" href="#">Scores</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Summary</a>
                        </li>
                        <li class="nav-item">
                          <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                        </li> 
                      </ul>
                      <form class="form-inline my-2 my-lg-0 mr-3">
                        <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
                      </form>
                      <span class="navbar-text">
                        Welcome User !!
                      </span>
                    </div>
                </nav>
                <div class="outer_box">
                    <div class="container">
                        <h3>Upcoming Quizzes</h3>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>No. of Questions</th>
                                    <th>Date</th>
                                    <th>Duration (hh:mm)</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>05</td>
                                    <td>xx/xx/yyyy</td>
                                    <td>00:10</td>
                                    <td>
                                        <button type="button" class="btn btn-outline-primary">View</button>
                                        <button type="button" class="btn btn-outline-success">Start</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td>10</td>
                                    <td>xx/xx/yyyy</td>
                                    <td>00:10</td>
                                    <td>
                                        <button type="button" class="btn btn-outline-primary">View</button>
                                        <button type="button" class="btn btn-outline-success">Start</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>3</td>
                                    <td>15</td>
                                    <td>xx/xx/yyyy</td>
                                    <td>00:30</td>
                                    <td>
                                        <button type="button" class="btn btn-outline-primary">View</button>
                                        <button type="button" class="btn btn-outline-success">Start</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="centre"><button type="button" class="btn btn-primary">Add Quiz</button></div>
        </div>
    </body>
</html>
