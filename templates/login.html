<!DOCTYPE html>
<html>
    <head>

        <link rel="stylesheet" href="../static/style/main.css">
        <link rel="stylesheet" href="../static/style/bootstrap.min.css">

        <title>Login</title>
    </head>
    <body>
        <div class="my_container">
            <div class="centre"><h1>Welcome to quiz master</h1></div>
            <div class="my_panel">
               <div class="centre"><h3 >Login</h3></div>
                <div class="input_form">
                    <div class="mb-3">
                        <label for="user_name" class="form-label">User name(E-mail)</label>
                        <input type="email" class="form-control" id="user_name" placeholder="Enter Your User Name">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter Your Password">
                    </div> 
                    <div class="mb-3">
                        <button type="button" class="btn btn-primary">Login</button>
                        New user?<a href="{{ url_for('signup') }}">Signup</a>
                    </div>   
                    
                </div>
            </div>
        </div>
    </body>
</html>
