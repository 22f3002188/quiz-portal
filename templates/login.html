<!DOCTYPE html>
<html>
    <head>

        <link rel="stylesheet" href="../static/style/main.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

        <title>Login</title>
    </head>
    <body>
        <div class="my_container">
            <div class="centre"><h1>Welcome to quiz master</h1></div>
            <div class="my_panel">
               <div class="centre"><h3 >Login</h3></div>
               <div class="input_form">
               <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">User Name (E-mail)</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter Your User Name" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter Your Password" required>
                </div> 
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Login</button>
                    New user? <a href="{{ url_for('signup') }}">Signup</a>
                </div>   
            </form>
        </div>
        </div>
        </div>
        
    </body>
</html>
