<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attempt Quiz - {{ quiz.quiz_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Quiz Attempt - {{ quiz.quiz_name }}</h2>
        <h5 class="text-center text-muted">Subject: {{ quiz.chapter.subject.name }} | Chapter: {{ quiz.chapter.name }}</h5>
        <h6 class="text-center text-primary">Date of Quiz: {{ quiz.date_of_quiz.strftime('%Y-%m-%d') }}</h6>

        <form method="POST">
            {% for question in questions %}
            <div class="card mt-3">
                <div class="card-body">
                    <h5 class="card-title">Q{{ loop.index }}: {{ question.question_statement }}</h5>
                    
                    <!-- Option 1 -->
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q{{ question.id }}" value="{{ question.option1 }}" required>
                        <label class="form-check-label">{{ question.option1 }}</label>
                    </div>
                    
                    <!-- Option 2 -->
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q{{ question.id }}" value="{{ question.option2 }}" required>
                        <label class="form-check-label">{{ question.option2 }}</label>
                    </div>

                    <!-- Option 3 -->
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q{{ question.id }}" value="{{ question.option3 }}" required>
                        <label class="form-check-label">{{ question.option3 }}</label>
                    </div>

                    <!-- Option 4 -->
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q{{ question.id }}" value="{{ question.option4 }}" required>
                        <label class="form-check-label">{{ question.option4 }}</label>
                    </div>
                </div>
            </div>
            {% endfor %}
            
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success">Submit Quiz</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
