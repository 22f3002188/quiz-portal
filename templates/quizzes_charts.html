{% extends "usernavbar.html" %}

{% block title %}Users Dashboard{% endblock %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .chart-container { width: 600px; height: 400px; }
    </style>
</head>
<body>
    <div class="container mt-4 text-center">
        <h3>Quiz Statistics</h3>
        <div class="row justify-content-center mt-4">
            <div class="col-md-8">
                <h5>Subject-wise Quizzes</h5>
                <div class="chart-container">
                    <canvas id="subjectChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        var subjectChartData = {{ subject_chart_data | tojson }};

        // Subject-wise Quizzes (Bar Chart)
        var ctx1 = document.getElementById('subjectChart').getContext('2d');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: subjectChartData.labels,
                datasets: [{
                    label: 'Number of Quizzes',
                    data: subjectChartData.quizzes,
                    backgroundColor: 'rgba(75, 192, 192, 0.7)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    </script>
</body>
{% endblock %}
