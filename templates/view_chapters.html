<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chapters - {{ subject.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="text-center">Chapters of {{ subject.name }}</h2>

        <div class="table-responsive">
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Chapter Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for chapter in chapters %}
                    <tr>
                        <td>{{ chapter.id }}</td>
                        <td>{{ chapter.name }}</td>
                        <td>{{ chapter.description }}</td>
                        <td>
                            <div class="d-flex justify-content-center gap-2">
                                <form action="{{ url_for('view_quizzes', chapter_id=chapter.id) }}" method="get" class="d-inline-block">
                                    <button type="submit" class="btn btn-info">View Quiz</button>
                                </form>
                                <form action="{{ url_for('edit_chapter', chapter_id=chapter.id) }}" class="d-inline-block">
                                    <button type="submit" class="btn btn-warning">Edit</button>
                                </form>
                                <form action="{{ url_for('delete_chapter', chapter_id=chapter.id) }}" method="post" class="d-inline-block">
                                    <button type="submit" class="btn btn-danger">Delete</button>
                                </form>
                                
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="text-center my-3">
            <form action="{{ url_for('add_chapter', subject_id=subject.id) }}" method="get">
                <button type="submit" class="btn btn-success">Add Chapter</button>
            </form>
        </div>

    </div>

</body>
</html>
