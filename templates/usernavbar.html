<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Quizzes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="#">Quiz Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link fw-bold text-white" href="{{ url_for('all_quizzes')}}">Home</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-white" href="{{ url_for('user_scores')}}">Scores</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-white" href="{{ url_for('quizzes_charts')}}">Summary</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-danger" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
                <!-- Search Button -->
                <form action="{{ url_for('search_quizzes') }}" method="GET" class="mb-3">
                    <div class="input-group">
                        <input type="text" name="q" class="form-control" placeholder="Search by quiz or subject name...">
                        <button class="btn btn-primary" type="submit">Search</button>
                    </div>
                </form>
                <span class="navbar-text text-white ms-3">
                    <i class="bi bi-person-circle"></i> Welcome, {{ session['full_name'] }}
                </span>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
