

{% extends "navbar.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Scorers & Attempts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .chart-container {
            width: 400px;
            height: 300px;
        }
    </style>
</head>
<body>
    <div class="container mt-4 text-center">
        <h3>Top Scorers & User Attempts</h3>
        
        <div class="row justify-content-center mt-4">
            <div class="col-md-5">
                <h5>Subject wise Top Scorers</h5>
                <div class="chart-container">
                    <canvas id="topScorersChart"></canvas>
                </div>
            </div>

            <div class="col-md-5">
                <h5>Subject wise User Attempts</h5>
                <div class="chart-container">
                    <canvas id="attemptsPieChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        var chartData = {{ chart_data | tojson }};
        var attemptChartData = {{ attempt_chart_data | tojson }};

        // Top Scorers Bar Chart
        var ctx1 = document.getElementById('topScorersChart').getContext('2d');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: chartData.labels,
                datasets: [{
                    label: 'Top Scores',
                    data: chartData.scores,
                    backgroundColor: 'rgba(54, 162, 235, 0.7)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: (tooltipItem) => 
                                'Score: ' + tooltipItem.raw + 
                                ' | ' + chartData.scorers[tooltipItem.dataIndex]
                        }
                    }
                }
            }
        });

        // User Attempts Pie Chart with Percentage
        var totalAttempts = attemptChartData.attempts.reduce((a, b) => a + b, 0);

        var ctx2 = document.getElementById('attemptsPieChart').getContext('2d');
        new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: attemptChartData.labels,
                datasets: [{
                    data: attemptChartData.attempts,
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: (tooltipItem) => {
                                var attempts = tooltipItem.raw;
                                var percentage = ((attempts / totalAttempts) * 100).toFixed(1);
                                return `Attempts: ${attempts} (${percentage}%)`;
                            }
                        }
                    },
                    datalabels: {
                        formatter: (value, ctx) => {
                            var percentage = ((value / totalAttempts) * 100).toFixed(1);
                            return percentage + "%";
                        },
                        color: '#fff',
                        font: { weight: 'bold' }
                    }
                }
            },
            plugins: [ChartDataLabels]
        });
    </script>
</body>
{% endblock %}
