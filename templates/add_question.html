<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center fs-4 fw-bold">
                Add Question to Quiz {{ quiz.id }}
            </div>
            <div class="card-body">
                <form action="{{ url_for('add_question', quiz_id=quiz.id) }}" method="post">
                    <div class="mb-3">
                        <label for="question_statement" class="form-label fw-bold">Question Statement</label>
                        <textarea class="form-control" id="question_statement" name="question_statement" rows="3" required></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="option1" class="form-label fw-bold">Option 1</label>
                            <input type="text" class="form-control" id="option1" name="option1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="option2" class="form-label fw-bold">Option 2</label>
                            <input type="text" class="form-control" id="option2" name="option2" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="option3" class="form-label fw-bold">Option 3</label>
                            <input type="text" class="form-control" id="option3" name="option3" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="option4" class="form-label fw-bold">Option 4</label>
                            <input type="text" class="form-control" id="option4" name="option4" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="correct_answer" class="form-label fw-bold">Correct Answer</label>
                        <select class="form-select" id="correct_answer" name="correct_answer" required>
                            <option value="">Select the correct answer</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                            <option value="option4">Option 4</option>
                        </select>
                    </div>
                    
                    <div class="text-center">
                        <button type="submit" class="btn btn-success btn-lg">Add Question</button>
                        <a href="{{ url_for('view_questions', quiz_id=quiz.id) }}" class="btn btn-primary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
