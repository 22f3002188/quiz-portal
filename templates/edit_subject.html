<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/dashboard2.css') }}">
    <title>Edit Subject</title>
</head>
<body>
    <div class="container">
        <h2>Edit Subject</h2>
        <form action="{{ url_for('edit_subject', id=subject.id) }}" method="POST">
            <div class="input-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" value="{{ subject.name }}" required>
            </div>

            <div class="input-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" required>{{ subject.description }}</textarea>
            </div>

            <div class="buttons">
                <button type="submit">Update</button>
                <button type="button" onclick="document.getElementById('cancel-form').submit();">Cancel</button>
            </div>
        </form>
        <form id="cancel-form" action="{{ url_for('admin_dashboard') }}" method="GET" style="display: none;"></form>
    </div>
</body>
</html>
