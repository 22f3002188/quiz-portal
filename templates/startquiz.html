<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <div class="d-flex justify-content-between">
            <span class="badge bg-warning text-dark p-2">QNo.: <span id="question-number">{{ current_question }}/{{ total_questions }}</span></span>
        </div>
        
        <div class="card mt-4 p-4 text-center">
            <h4 class="mb-4">{{ question.statement }}</h4>
            <form id="quiz-form">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="answer" id="option1" value="{{ question.option1 }}">
                    <label class="form-check-label" for="option1">{{ question.option1 }}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="answer" id="option2" value="{{ question.option2 }}">
                    <label class="form-check-label" for="option2">{{ question.option2 }}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="answer" id="option3" value="{{ question.option3 }}">
                    <label class="form-check-label" for="option3">{{ question.option3 }}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="answer" id="option4" value="{{ question.option4 }}">
                    <label class="form-check-label" for="option4">{{ question.option4 }}</label>
                </div>
                
                <div class="mt-4 d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-primary">Save and Next</button>
                    <button type="button" class="btn btn-success" onclick="submitQuiz()">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function submitQuiz() {
            alert("Quiz Submitted!");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
