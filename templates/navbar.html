<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="#">Quiz Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link fw-bold text-white" href="{{ url_for('admin_dashboard') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-white" href="{{ url_for('users') }}">Users</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-white" href="{{ url_for('top_scorers')}}">Summary</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-danger" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
                
                <!-- Search Form Directly Inside Navbar -->
                <form action="{{ url_for('search') }}" method="GET" class="mb-3">
                    <div class="input-group">
                        <input type="text" name="q" class="form-control" placeholder="Search users, subjects, chapters, quizzes">
                        <button class="btn btn-primary" type="submit">Search</button>
                    </div>
                </form>

                <span class="navbar-text text-white fw-bold ms-3">Welcome Admin</span>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
