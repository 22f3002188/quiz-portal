<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Edit Quiz</h2>
        <form action="{{ url_for('edit_quiz', quiz_id=quiz.id) }}" method="POST">
            <label>Quiz Name:</label>
            <input type="text" name="quiz_name" class="form-control" value="{{ quiz.quiz_name }}" required>
            <label>Quiz Date:</label>
            <input type="date" name="date_of_quiz" class="form-control" 
                   value="{{ quiz.date_of_quiz.strftime('%Y-%m-%d') }}" required>
            <label>Time Duration (HH:MM):</label>
            <input type="time" name="time_duration" class="form-control" 
                   value="{{ quiz.time_duration.strftime('%H:%M') }}" required>
            
            <button type="submit" class="btn btn-primary mt-3">Update Quiz</button>
            <a href="{{ url_for('view_quizzes', chapter_id=quiz.chapter_id) }}" class="btn btn-secondary mt-3">Cancel</a>
        </form>
    </div>
</body>
</html>
