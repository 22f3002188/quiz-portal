<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quizzes - {{ chapter.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="text-center">Quizzes for {{ chapter.name }}</h2>

        <div class="table-responsive">
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Duration</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for quiz in quizzes %}
                    <tr>
                        <td>{{ quiz.id }}</td>
                        <td>{{ quiz.date_of_quiz.strftime('%Y-%m-%d %H:%M') }}</td>
                        <td>{{ quiz.time_duration }}</td>
                        <td>
                            <div class="d-flex justify-content-center gap-2">
                                <form action="{{ url_for('view_quizzes', id=chapter.id) }}" class="d-inline-block">
                                    <button type="submit" class="btn btn-primary">View</button>
                                </form>
                                <form action="{{ url_for('edit_quiz', id=quiz.id) }}" class="d-inline-block">
                                    <button type="submit" class="btn btn-warning">Edit</button>
                                </form>
                                <form action="{{ url_for('delete_quiz', id=quiz.id) }}" method="post" class="d-inline-block">
                                    <button type="submit" class="btn btn-danger">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="text-center my-3">
            <form action="{{ url_for('add_quiz', chapter_id=chapter.id) }}" method="get">
                <button type="submit" class="btn btn-success">Add Quiz</button>
            </form>
        </div>

    </div>

</body>
</html>
