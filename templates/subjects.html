<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="card shadow-lg p-4 border-0">
            <h2 class="text-center mb-4">New Subject</h2>
            
            <form action="{{ url_for('manage_subjects') }}" method="POST" class="mb-4">
                <div class="mb-3">
                    <input type="text" name="name" class="form-control" placeholder="Subject Name" required>
                </div>
                <div class="mb-3">
                    <textarea name="description" class="form-control" rows="3" placeholder="Subject Description" required></textarea>
                </div>
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
