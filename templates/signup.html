<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../static/style/main.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <title>Signup</title>
    </head>
    <body>
       
        <div class="my_container">
            <div class="centre"><h1>Welcome to quiz master</h1></div>
            <div class="my_panel">
               <div class="centre"><h3>Signup</h3></div>
               <form method="POST" action="{{ url_for('signup') }}">
                <div class="input_form">
                        <div class="mb-3">
                            <label for="email" class="form-label">User name(E-mail)</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter Your User Name", required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter Your Password", required>
                        </div> 
                        <div class="mb-3">
                            <label for="full_name" class="form-label">Full name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Enter your Full Name", required>
                        </div> 
                        <div class="mb-3">
                            <label for="qualification" class="form-label">Qualification</label>
                            <input type="text" class="form-control" id="qualification" name="qualification" placeholder="Enter Your Qualification", required>
                        </div>
                        <div class="mb-3">
                            <label for="dob" class="form-label">DOB</label>
                            <input type="date" class="form-control" id="dob" name="dob", required>
                        </div>
                        <button type="submit" class="btn btn-primary">Signup</button>
                </div>
            </form>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger" role="alert">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
    </body>
</html>
