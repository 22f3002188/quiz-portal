<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48%, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid black;
        }

        .subject-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        .table th {
            background: #cce5ff;
        }

        .add-chapter-btn {
            display: block;
            background: lightcoral;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
            margin: 15px auto 0 auto;
            width: 120px;
            cursor: pointer;
        }

        .add-subject-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid orange;
            color: black;
            font-size: 20px;
            margin: 30px auto;
            cursor: pointer;
        }

        .add-subject-btn:hover {
            background: orange;
            color: white;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-primary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Quiz</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Summary</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <span class="navbar-text text-white ms-2">Welcome Admin</span>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        {% for subject in subjects %}
        <div class="subject-card">
            <div class="subject-title">{{ subject.name }}</div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Chapter Name</th>
                        <th>No. of Questions</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>----</td>  <!-- Empty placeholder for Chapter Name -->
                        <td>----</td>  <!-- Empty placeholder for No. of Questions -->
                        <td>Edit/Delete</td>  <!-- Default Action column -->
                    </tr>
                </tbody>
            </table>
            <button class="add-chapter-btn">+ Chapter</button>
        </div>
        {% endfor %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>



<div class="text-center">
    <a href="{{ url_for('add_subject') }}" class="add-subject-btn">+</a>
</div>

</body>
</html>
