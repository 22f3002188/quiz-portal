{% extends "navbar.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
    <h2 class="text-center text-white">Admin Dashboard</h2>

    <!-- Subjects Table -->
    <div class="card p-3 shadow-sm">
        <div class="card-body">
            <table class="table table-hover text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Subject Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for subject in subjects %}
                    <tr class="table-light">
                        <td><strong>{{ subject.id }}</strong></td>
                        <td>{{ subject.name }}</td>
                        <td>{{ subject.description }}</td>
                        <td>
                            <div class="d-flex justify-content-center gap-2">
                                <a href="{{ url_for('view_chapters', subject_id=subject.id) }}" class="btn btn-info btn-sm">View Chapter</a>
                                <a href="{{ url_for('edit_subject', id=subject.id) }}" class="btn btn-warning btn-sm">Edit</a>
                                <form action="{{ url_for('delete_subject', id=subject.id) }}" method="post" class="d-inline-block">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add New Subject Button -->
    <div class="text-center mt-4">
        <form action="{{ url_for('manage_subjects') }}">
            <button type="submit" class="btn btn-success px-4 py-2">Add New Subject</button>
        </form>
    </div>
{% endblock %}
