<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../static/style/dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-primary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Quiz</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Summary</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <span class="navbar-text text-white ms-2">Welcome Admin</span>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        {% for subject in subjects %}
        <div class="subject-card">
            <div class="subject-title">{{ subject.name }}</div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Chapter Name</th>
                        <th>No. of Questions</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>----</td>  <!-- Empty placeholder for Chapter Name -->
                        <td>----</td>  <!-- Empty placeholder for No. of Questions -->
                        <td>Edit/Delete</td>  <!-- Default Action column -->
                    </tr>
                </tbody>
            </table>
            <a href="{{ url_for('add_chapter') }}" class="add-chapter-btn">+ Chapter</a>
            <!-- <button class="add-chapter-btn">+ Chapter</button> -->
        </div>
        {% endfor %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>



<div class="text-center">
    <a href="{{ url_for('add_subject') }}" class="add-subject-btn">+</a>
</div>

</body>
</html>
