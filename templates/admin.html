{% extends "navbar.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
    <div class="container mt-4">
        <div class="card-header bg-primary text-white text-center fs-4 fw-bold">
            Subjects
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Subject Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for subject in subjects %}
                        <tr>
                            <td>{{ subject.id }}</td>
                            <td>{{ subject.name }}</td>
                            <td>{{ subject.description }}</td>
                            <td>
                                <div class="d-flex justify-content-center gap-2">
                                    <a href="{{ url_for('view_chapters', subject_id=subject.id) }}" class="btn btn-info btn-sm text-white">View Chapter</a>
                                    <a href="{{ url_for('edit_subject', id=subject.id) }}" class="btn btn-warning btn-sm">Edit</a>
                                    <form action="{{ url_for('delete_subject', id=subject.id) }}" method="POST">
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                    
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="text-center mt-4">
                <a href="{{ url_for('manage_subjects') }}" class="btn btn-success">Add New Subject</a>
            </div>
        </div>
    </div>
{% endblock %}
